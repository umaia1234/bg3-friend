[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bg3-friend"
version = "0.2.0rc1"
description = "BG3 companion co-player with a portable Windows setup app"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1", "lupa==2.8"]

[tool.setuptools]
packages = ["companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
